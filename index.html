<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGHA Ecosystem — Démo</title>
<style>

*{box-sizing:border-box}

.demo{background:var(--g);color:#fff;font-size:12px;text-align:center;padding:4px 10px;font-weight:bold;letter-spacing:.3px}
.app{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 26px);min-height:600px}
.side{background:var(--bd);color:#fff;display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.logo{font-family:"Times New Roman",serif;font-size:22px;color:var(--g);letter-spacing:1px;font-weight:bold;padding:0 8px}
.logo small{display:block;font:11px Calibri,sans-serif;color:#b9cfe0;letter-spacing:.5px;margin-top:2px}
.sl{font-size:10px;letter-spacing:1px;color:#7fa3be;margin:16px 8px 6px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}

.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}

.nav.sec button.on{box-shadow:inset 3px 0 0 var(--g)}
.ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:bold;font-size:12px;color:#fff;flex:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bdg{margin-left:auto;background:var(--g);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:bold}
.sfoot{margin-top:auto;font-size:11px;color:#8fb0c9;padding:10px 8px 0}
.sfoot button{background:none;border:1px solid #4f7a99;color:#cfe0ee;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px;margin-top:6px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{background:#fff;border-bottom:3px solid var(--pc);padding:10px 22px;display:flex;align-items:center;gap:14px}

.user{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px}
.bell{position:relative;background:var(--bg);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--bd);display:grid;place-items:center}

.content{padding:16px 22px;overflow:auto;flex:1}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ph h2{margin:0;font-size:17px;color:var(--bd)}.ph .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.5fr 1fr}.g12{grid-template-columns:1fr 1.5fr}.g4{grid-template-columns:repeat(4,1fr)}.g31{grid-template-columns:320px 1fr}

.col{display:flex;flex-direction:column;gap:14px;min-width:0}

.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:bold;white-space:nowrap}

.lbl{color:var(--m);font-size:12px}.small{font-size:12px;color:var(--m)}.mt{margin-top:12px}.right{text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--m);font-size:11px;text-transform:uppercase;padding:6px;border-bottom:1px solid var(--ln);letter-spacing:.3px}

tr.clk{cursor:pointer}tr.clk:hover td{background:#f7fafc}
.H{color:var(--er);font-weight:bold}.N{color:var(--ok)}
.kpi{border-left:4px solid var(--pc)}.kpi b{font-size:28px;color:var(--pc);display:block;line-height:1.1}.kpi span{font-size:12px;color:var(--m)}

.tl .it{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}.tl .it:hover{background:#f4f8fb}.tl .tm{width:46px;font-weight:bold;color:var(--pc)}

.seg{display:inline-flex;border:1px solid var(--pc);border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;color:var(--pc);padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:bold;font-size:12px}.seg button.on{background:var(--pc);color:#fff}
.wk{background:#fff;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.wkh,.wkb{display:grid;grid-template-columns:50px repeat(7,1fr)}

.hrs div{height:68px;font-size:10px;color:var(--m);text-align:right;padding:0 6px;transform:translateY(-6px)}
.dc{position:relative;border-left:1px solid var(--ln);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#eef2f6 33px,#eef2f6 34px)}
.dc.we{background-color:#fafbfc}.dc.tdy{background-color:#f4f9fd}
.ap{position:absolute;left:2px;right:2px;border-radius:6px;padding:2px 5px;font-size:11px;overflow:hidden;border-left:4px solid;cursor:pointer;line-height:1.25}
.ap b{display:block;font-size:11.5px}.ap.ok{background:var(--bl);border-color:var(--pc);color:var(--bd)}.ap.se{background:var(--wal);border-color:var(--wa);color:#7a4b00}.ap.dn{background:var(--okl);border-color:var(--ok);color:#10674a}.ap.er{background:var(--erl);border-color:var(--er);color:#8a2222;text-decoration:line-through}
.mo{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.mo .h{padding:6px;text-align:center;font-size:11px;color:var(--m);background:#f8fafc;border-bottom:1px solid var(--ln)}

.mo .e{background:var(--bl);border-left:3px solid var(--pc);border-radius:3px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bd)}
/* forms and modal */
.ov{position:fixed;inset:0;background:rgba(10,30,50,.45);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:#fff;border-radius:12px;width:520px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}.md.wide{width:720px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);color:var(--bd);font-size:15px}.mh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--m)}
.mb{padding:14px 16px;overflow:auto}.mf{padding:10px 16px;border-top:1px solid var(--ln);display:flex;gap:8px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .full{grid-column:1/-1}
label.f{display:block}label.f span{display:block;font-size:11px;color:var(--m);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:13px;background:#fff;color:var(--t)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bl);border-color:var(--pc)}
textarea{min-height:80px;resize:vertical}
input.num{width:90px}
.chk{display:flex;gap:6px;align-items:center;padding:4px 0;font-size:13px}.chk input{width:auto}
.search{max-width:300px}
.pl{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;margin-top:8px}
.pi{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;background:#fff}.pi.on{border-color:var(--g);background:var(--gl)}.pi .av{width:30px;height:30px;font-size:11px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}.im{width:110px;height:84px;border-radius:6px;position:relative;overflow:hidden;border:1px solid #333}.im em{position:absolute;left:4px;bottom:3px;color:#cfd8e0;font-size:9px;font-style:normal}
.xr{background:radial-gradient(ellipse 20% 36% at 33% 48%,#20252b 0,#454b53 65%,transparent 100%),radial-gradient(ellipse 20% 36% at 67% 48%,#20252b 0,#454b53 65%,transparent 100%),radial-gradient(ellipse 10% 14% at 70% 64%,rgba(235,240,245,.85),transparent),radial-gradient(ellipse 5% 62% at 50% 48%,#cfd4da,transparent),radial-gradient(ellipse 45% 14% at 50% 12%,#aeb4bb,transparent),#101419}
.xr.n{background:radial-gradient(ellipse 20% 36% at 33% 48%,#20252b 0,#454b53 65%,transparent 100%),radial-gradient(ellipse 20% 36% at 67% 48%,#20252b 0,#454b53 65%,transparent 100%),radial-gradient(ellipse 5% 62% at 50% 48%,#cfd4da,transparent),#101419}
.us{background:conic-gradient(from 150deg at 50% 0%,#0a0d10 0deg,#59626b 30deg,#232a30 60deg,#6c767f 90deg,#1c2227 120deg,#0a0d10 60deg),#0a0d10}
.ai{background:linear-gradient(135deg,#f3ecfb,#e6f0f7);border:1px solid #c9b8e8}.ai h3{color:#5b3a9a}
.beds{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.beds i{width:16px;height:16px;border-radius:4px;background:#d4dde5}.beds i.o{background:var(--pc)}.beds i.f{background:#c2ecd9}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border:1px solid var(--ln);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer;font-size:12px;font-family:inherit;color:var(--m)}.tabs button.on{background:var(--pc);color:#fff;border-color:var(--pc)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--bd);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}.toast.show{opacity:1}
.warn{background:var(--wal);border:1px solid #f0c36b;color:#7a4b00;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
</style></head><body>

const ICON={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',flask:'<path d="M9 3h6M10 3v6L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 9V3"/>',file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',bed:'<path d="M2 19V6M2 14h20v5M22 14v-2a3 3 0 0 0-3-3h-8v5"/><circle cx="6.5" cy="11" r="1.5"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'};

/* ---------- catalogues ---------- */
const LABCAT={'Glycémie à jeun':{u:'g/L',lo:.7,hi:1.1,m:.9},'HbA1c':{u:'%',lo:4,hi:6.5,m:5.4},'CRP':{u:'mg/L',lo:0,hi:5,m:2},'Globules blancs':{u:'10³/µL',lo:4,hi:10,m:7},'Hémoglobine':{u:'g/dL',lo:13,hi:17,m:14.5},'Cholestérol total':{u:'g/L',lo:1.2,hi:2,m:1.7},'LDL':{u:'g/L',lo:.5,hi:1.3,m:1},'TSH':{u:'mUI/L',lo:.4,hi:4,m:2},'Créatinine':{u:'mg/L',lo:7,hi:13,m:10},'ALAT':{u:'UI/L',lo:7,hi:40,m:25}};
const KARIM={'Glycémie à jeun':1.86,'HbA1c':8.1,'CRP':48,'Globules blancs':13.4,'Hémoglobine':13.2};

 doctor:{n:'SIGHA Doctor',c:'#125B89',i:'D',org:'Cabinet de médecine générale · Constantine',u:'Dr Meriem Haddad',a:'MH'},

 imaging:{n:'SIGHA Imaging',c:'#7a4fc2',i:'I',org:"Centre d'imagerie Ibn Sina · Constantine",u:'Dr Samir Ouali, radiologue',a:'SO'},
 pharmacy:{n:'SIGHA Pharmacy',c:'#d98200',i:'P',org:'Pharmacie Benyahia · Constantine',u:'Lamia Benyahia, pharmacienne',a:'LB'},
 hospital:{n:'SIGHA Hospital',c:'#c0392b',i:'H',org:'Centre Hospitalier Les Jasmins · Constantine',u:'Dr Yacine Mebarki, urgences',a:'YM'}};
const SECS={

   return `<div class="dc ${cl}" onclick="slotClick(event,'${owner}','${ds}')">${apps.filter(a=>a.date==ds).map(a=>{const top=(mins(a.time)-480)/30*ROW+1,h=Math.max(a.dur/30*ROW-3,22);const c={'Confirmé':'ok','En attente':'se','Terminé':'dn','Annulé':'er'}[a.status];return `<div class="ap ${c}" style="top:${top}px;height:${h}px" onclick="event.stopPropagation();apptM(${a.id})"><b>${esc(a.time)} ${esc(a.who)}</b>${esc(a.type)}</div>`}).join('')}</div>`}).join('')}</div></div>`;
 }else{const f=new Date(C.d.getFullYear(),C.d.getMonth(),1);title=MO[f.getMonth()][0].toUpperCase()+MO[f.getMonth()].slice(1)+' '+f.getFullYear();const s=wkStart(f);const n=Math.ceil((f.getDay()+new Date(f.getFullYear(),f.getMonth()+1,0).getDate())/7)*7;
  body=`<div class="mo">${DJ.map(x=>`<div class="h">${x}</div>`).join('')}${[...Array(n)].map((_,i)=>{const d=addDays(s,i),ds=fmt(d),a=apps.filter(x=>x.date==ds&&x.status!='Annulé').sort(byTime);return `<div class="c ${d.getMonth()!=f.getMonth()?'o':''} ${ds==fmt(today)?'tdy':''}" onclick="calDay('${owner}','${ds}')"><div class="n">${d.getDate()}</div>${a.slice(0,3).map(x=>`<div class="e">${x.time} ${esc(x.who)}</div>`).join('')}${a.length>3?`<div class="small">+${a.length-3} autres</div>`:''}</div>`}).join('')}</div>`}
 return `<div class="ph"><h2>Agenda</h2><div class="sp"><button class="btn" onclick="apptM(0,'${owner}')">+ Nouveau rendez-vous</button></div></div>
 <div class="cb"><button class="btn ghost sm" onclick="calNav('${owner}',-1)">‹</button><button class="btn ghost sm" onclick="calNav('${owner}',1)">›</button><button class="btn ghost sm" onclick="calToday('${owner}')">Aujourd’hui</button><h2>${title}</h2><span class="seg"><button class="${C.v=='week'?'on':''}" onclick="calView('${owner}','week')">Semaine</button><button class="${C.v=='month'?'on':''}" onclick="calView('${owner}','month')">Mois</button></span></div>${body}`}

 const doSave=()=>{const r={id:d.id||nid(),pid:p.id,who:pname(p),date:fmt(today),diag:d.diag,items:d.items,note:d.note,status:send?'Reçue':'Brouillon'};const i=DB.rx.findIndex(x=>x.id==r.id);if(i>=0)DB.rx[i]=r;else DB.rx.push(r);if(send)log('doctor','pharmacy','Ordonnance : '+pname(p));U.rxd=null;toast(send?'Ordonnance envoyée à la pharmacie':'Brouillon enregistré');render()};

 return kpis([[a.length,'À préparer'],[p.length,'Prêtes (en attente du patient)'],[d.length,'Délivrées'],[low.length,'Alertes de stock']])+`<div class="grid g21 mt"><div class="col">${todo(a.map(x=>[`Nouvelle ordonnance : <b>${esc(x.who)}</b> · ${x.items.length} médicament(s)`,'Ouvrir',`phView(${x.id})`]))}<div class="card"><h3>Alertes de stock</h3>${low.map(e=>`<div class="row"><span>${esc(e[0])}</span>${chip(e[1]?e[1]+' boîtes':'Rupture',e[1]?'se':'er')}</div>`).join('')||'<div class="small">Aucune alerte.</div>'}</div></div><div class="col"><div class="card"><h3>Répartition</h3>${[['À préparer',a.length,'w'],['Prêtes',p.length,''],['Délivrées',d.length,'']].map(x=>`<div class="row"><span style="width:90px">${x[0]}</span><div class="bar"><i class="${x[2]}" style="width:${r.length?x[1]/r.length*100:0}%"></i></div><b>${x[1]}</b></div>`).join('')}</div>${feed('pharmacy')}</div></div>`}
function phRx(){const l=DB.rx.filter(r=>r.status!='Brouillon').sort((a,b)=>({'Reçue':0,'Prête':1,'Délivrée':2}[a.status]-{'Reçue':0,'Prête':1,'Délivrée':2}[b.status])||b.id-a.id);
 return `<div class="ph"><h2>Ordonnances reçues</h2></div><div class="card"><table><tr><th>Date</th><th>Patient</th><th>Prescripteur</th><th>Médicaments</th><th>Statut</th><th></th></tr>${l.map(r=>`<tr><td>${dlong(r.date)}</td><td><b>${esc(r.who)}</b></td><td>Dr Haddad</td><td class="small">${esc(r.items.map(i=>i.drug).join(' · '))}</td><td>${st(r.status)}</td><td class="right"><button class="btn sm ghost" onclick="phView(${r.id})">Voir</button> ${r.status=='Reçue'?`<button class="btn sm" onclick="phSet(${r.id},'Prête')">Marquer prête</button>`:r.status=='Prête'?`<button class="btn sm gold" onclick="phSet(${r.id},'Délivrée')">Remise au patient</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="small">Aucune ordonnance.</td></tr>'}</table></div>`}
function phView(id){const r=DB.rx.find(x=>x.id==id);const b=[{l:'Fermer',c:'ghost'}];if(r.status=='Reçue')b.push({l:'Marquer prête',f:()=>phSet(id,'Prête',1)});if(r.status=='Prête')b.push({l:'Remise au patient',c:'gold',f:()=>phSet(id,'Délivrée',1)});
 modal('Ordonnance · '+esc(r.who),`<div class="small">${dlong(r.date)} · ${esc(r.diag)}</div><table class="mt"><tr><th>Médicament</th><th>Posologie</th><th>Durée</th><th>Stock</th></tr>${r.items.map(i=>{const s=STOCK[i.drug];return `<tr><td>${esc(i.drug)}</td><td>${esc(i.dose)}</td><td>${esc(i.duree)}</td><td>${s===undefined||s>5?chip('En stock','ok'):s>0?chip('Stock faible','se'):chip('Rupture','er')}</td></tr>`}).join('')}</table><div class="mt">${st(r.status)}</div>${r.note?`<p class="small">${esc(r.note)}</p>`:''}`,b)}
function phSet(id,s,silent){const r=DB.rx.find(x=>x.id==id);r.status=s;log('pharmacy','doctor',(s=='Prête'?'Ordonnance prête : ':'Ordonnance délivrée : ')+r.who);toast(s=='Prête'?'Ordonnance prête · médecin notifié':'Remise confirmée');if(!silent)render()}

/* ---------- HOSPITAL ---------- */
function aiTriage(r){let s=2,sv='Médecine interne';const re=[];const m=r.motif.toLowerCase();
 if(/toux|fi[èe]vre|respir|pneumo/.test(m)){s=3;sv='Pneumologie';re.push('Symptômes respiratoires fébriles')}
 if(/thorac|cardiaque|palpit/.test(m)){s=4;sv='Cardiologie';re.push('Douleur thoracique : écarter un syndrome coronarien aigu')}
 if(/fracture|chute|trauma|accident/.test(m)){s=3;sv='Chirurgie';re.push('Contexte traumatique')}
 if(/enfant|p[ée]diatr/.test(m)||r.age<15){sv='Pédiatrie'}
 if(r.vit.spo2&&r.vit.spo2<94){s++;re.push(`SpO₂ ${r.vit.spo2} % : surveillance rapprochée`)}
 if(r.vit.temp>=38.5)re.push(`Fièvre ${r.vit.temp} °C`);
 const ta=parseInt(String(r.vit.ta).split('/')[0]);if(ta>=160){s++;re.push(`Tension élevée (${r.vit.ta})`)}
 if(r.urgent=='Urgente')s++;
 if(r.pid){const p=pat(r.pid);if(p&&/diab/i.test(p.ant)){re.push('Antécédent de diabète : risque de complications');}const o=DB.orders.filter(x=>x.pid==r.pid&&x.status=='Terminée');const ab=o.filter(x=>x.type=='lab').reduce((n,x)=>n+x.exams.filter(e=>{const f=flag(e,x.results[e]);return f&&f!='Normal'}).length,0);if(ab)re.push(`${ab} résultat(s) biologique(s) anormal(aux) transmis`);if(o.some(x=>x.type=='img'))re.push('Compte rendu d’imagerie joint')}
 return{score:Math.min(5,s),service:sv,reasons:re}}
function hDash(){const tot=DB.wards.reduce((a,w)=>a+w.cap,0),occ=DB.wards.reduce((a,w)=>a+w.occ,0);const inc=DB.refs.filter(r=>r.status=='À trier');
 return kpis([[`${occ} / ${tot}`,'Lits occupés'],[Math.round(occ/tot*100)+' %','Taux d’occupation'],[inc.length,'Dossiers à trier'],[DB.refs.filter(r=>r.status=='Admis').length,'Admissions récentes']])+`<div class="grid g21 mt"><div class="col">${todo(inc.map(r=>[`Dossier à trier : <b>${esc(r.who)}</b> · ${esc(r.motif)} ${r.urgent=='Urgente'?chip('Urgent','er'):''}`,'Ouvrir le triage',`U.ref=${r.id};sc('incoming')`]))}<div class="card"><h3>Occupation par service</h3>${DB.wards.map(w=>{const p=Math.round(w.occ/w.cap*100);return `<div class="row"><span style="width:130px">${w.n}</span><div class="bar"><i class="${p>=90?'e':p>=80?'w':''}" style="width:${p}%"></i></div><b style="width:42px;text-align:right">${p}%</b></div>`}).join('')}</div></div><div class="col">${feed('hospital')}</div></div>`}
function hIncoming(){const l=DB.refs.slice().sort((a,b)=>(a.status=='À trier'?0:1)-(b.status=='À trier'?0:1)||b.id-a.id);if(!U.ref||!DB.refs.find(r=>r.id==U.ref))U.ref=l[0]?.id;const r=DB.refs.find(x=>x.id==U.ref);let det='';
 if(r){const a=aiTriage(r);det=`<div class="col"><div class="card"><h3>Dossier ${st(r.status)}</h3><div style="font-size:18px;font-weight:bold">${esc(r.who)}, ${r.age} ans</div><div class="small">Adressé par ${esc(r.from)} · ${dlong(r.date)}</div><div class="row mt"><span class="lbl">Motif</span><span>${esc(r.motif)}</span></div><div class="row"><span class="lbl">Constantes</span><span>T° ${r.vit.temp} · SpO₂ ${r.vit.spo2} % · TA ${esc(r.vit.ta)}</span></div><div class="row"><span class="lbl">Urgence</span>${st(r.urgent)}</div>${r.service?`<div class="row"><span class="lbl">Service</span><b>${esc(r.service)}</b></div>`:''}</div>
 <div class="card ai"><h3>Assistant IA · aide au triage ${chip('suggestion','ai')}</h3><div style="font-size:16px"><b>Orientation suggérée : ${a.service}</b></div><div class="mt">Priorité : ${chip(a.score+' / 5','se')}</div><ul style="padding-left:18px;margin:10px 0">${a.reasons.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Pas d’élément de gravité identifié</li>'}</ul><div class="small">La décision reste celle du médecin : l’IA propose, ne décide pas.</div>
 ${r.status=='À trier'?`<div class="mt" style="display:flex;gap:8px"><button class="btn" onclick="admitM(${r.id})">Valider l’admission</button><button class="btn ghost" onclick="redirM(${r.id})">Orienter ailleurs</button></div>`:''}</div></div>`}
 return `<div class="ph"><h2>Dossiers entrants</h2></div><div class="grid g31"><div class="card"><h3>File d’arrivée</h3><div class="pl">${l.map(x=>`<div class="pi ${x.id==U.ref?'on':''}" onclick="U.ref=${x.id};render()"><div style="flex:1"><b>${esc(x.who)}</b><div class="small">${esc(x.motif)}</div></div>${st(x.status)}</div>`).join('')}</div></div>${det}</div>`}
function admitM(id){const r=DB.refs.find(x=>x.id==id),a=aiTriage(r);modal('Valider l’admission',`<div class="small">Patient : <b>${esc(r.who)}</b></div><div class="fg mt">${sel('sv','Service d’admission',DB.wards.map(w=>[w.n,`${w.n} (${w.cap-w.occ} lits libres)`]),a.service,'full')}</div>`,[{l:'Annuler',c:'ghost'},{l:'Valider',f:()=>{const w=DB.wards.find(x=>x.n==g('sv'));if(w.occ>=w.cap){toast('Service complet');return false}w.occ++;r.status='Admis';r.service=w.n;if(r.from=='Dr Haddad')log('hospital','doctor',`Patient admis : ${r.who} (${w.n})`);toast('Admission validée · '+w.n)}}])}
function redirM(id){const r=DB.refs.find(x=>x.id==id);modal('Orienter ailleurs',`<div class="fg">${ta('why','Motif / établissement proposé','Service saturé. Orientation vers un établissement voisin.','full')}</div>`,[{l:'Annuler',c:'ghost'},{l:'Confirmer',f:()=>{r.status='Orienté ailleurs';if(r.from=='Dr Haddad')log('hospital','doctor','Patient réorienté : '+r.who);toast('Patient réorienté')}}])}
function hBeds(){return `<div class="ph"><h2>Lits et services</h2></div><div class="grid g2">${DB.wards.map(w=>{const p=Math.round(w.occ/w.cap*100);return `<div class="card"><h3>${w.n} ${chip(p+' %',p>=90?'er':p>=80?'se':'ok')}</h3><div class="small">${w.occ} occupés · ${w.cap-w.occ} libres sur ${w.cap}</div><div class="beds">${[...Array(w.cap)].map((_,i)=>`<i class="${i<w.occ?'o':'f'}"></i>`).join('')}</div></div>`}).join('')}</div>`}

/* ---------- rendu ---------- */
const V={
 doctor:{dash:dDash,agenda:()=>calendar('doctor'),patients:dPatients,exams:dExams,rx:dRx},
 lab:{dash:()=>oDash('lab'),agenda:()=>calendar('lab'),orders:()=>U.labEd?labEditor():oList('lab'),hist:()=>oHist('lab')},
 imaging:{dash:()=>oDash('img'),agenda:()=>calendar('imaging'),orders:()=>U.imgEd?imgEditor():oList('img'),hist:()=>oHist('img')},
 pharmacy:{dash:phDash,rx:phRx},
 hospital:{dash:hDash,incoming:hIncoming,beds:hBeds}};
function badge(p){return {doctor:DB.orders.filter(o=>o.status=='Terminée'&&!o.seen).length,lab:DB.orders.filter(o=>o.type=='lab'&&o.status=='Reçue').length,imaging:DB.orders.filter(o=>o.type=='img'&&o.status=='Reçue').length,pharmacy:DB.rx.filter(r=>r.status=='Reçue').length,hospital:DB.refs.filter(r=>r.status=='À trier').length}[p]}
function render(){const p=P[U.p],y=document.documentElement.scrollTop;const sy=$('#content')?$('#content').scrollTop:0;
 $('#app').style.setProperty('--pc',p.c);
 $('#plat').innerHTML=Object.keys(P).map(k=>{const b=badge(k);return `<button class="${U.p==k?'on':''}" onclick="go('${k}')"><span class="ic" style="background:${P[k].c}">${P[k].i}</span>${P[k].n.replace('SIGHA ','')}${b?`<span class="bdg">${b}</span>`:''}</button>`}).join('');
 $('#secl').textContent=p.n;
 $('#sec').innerHTML=SECS[U.p].map(s=>`<button class="${U.sec[U.p]==s[0]?'on':''}" onclick="sc('${s[0]}')">${ic(s[2])}${s[1]}</button>`).join('');
 $('#ttl').textContent=p.n;$('#org').textContent=p.org;$('#unm').textContent=p.u;$('#uav').textContent=p.a;
 const n=DB.log.filter(x=>x.to==U.p&&!x.read).length;$('#bell').innerHTML=ic('bell')+(n?`<b>${n}</b>`:'');
 $('#content').innerHTML=V[U.p][U.sec[U.p]]();$('#content').scrollTop=sy}
function resetDemo(){seed();U.rxd=U.labEd=U.imgEd=null;U.pid=1;U.ref=null;render();toast('Démo réinitialisée')}
function guide(){modal('Parcours conseillé',`<ol style="line-height:1.7;padding-left:18px"><li><b>Doctor › Patients</b> : ouvrez le dossier de Karim Bensalem, ajoutez ou modifiez un patient.</li><li><b>Doctor › Agenda</b> : cliquez sur un créneau vide pour créer un rendez-vous, cliquez sur un rendez-vous pour le modifier ou le supprimer.</li><li><b>Doctor › Examens</b> : « Nouvelle demande » vers le laboratoire et l’imagerie.</li><li><b>Lab</b> puis <b>Imaging</b> : ouvrez la demande, saisissez ou importez les résultats, envoyez.</li><li><b>Doctor › Examens</b> : consultez les résultats reçus.</li><li><b>Doctor › Ordonnances</b> : rédigez l’ordonnance et envoyez-la à la pharmacie.</li><li><b>Pharmacy</b> : marquez l’ordonnance prête, puis remise au patient.</li><li><b>Doctor › Patients › Adresser à l’hôpital</b>, puis <b>Hospital › Dossiers entrants</b> : triage assisté par l’IA et admission.</li></ol>`,[{l:'Fermer',c:'ghost'}],true)}
render();
</script></body></html>
